    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {

    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;

  .caption-pill {

    background: var(--cap-canvas, #efe7d4);

  .caption-word {

    padding: 0 0.06em;
    color: color-mix(in srgb, var(--cap-ink, #1a1a17) 42%, var(--cap-canvas, #efe7d4));

    background: transparent;

  .caption-word.cap-num {
